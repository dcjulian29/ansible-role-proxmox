---
- name: Ensure the subscription notice is removed
  ansible.builtin.include_tasks: nag.yml
  when: proxmox_remove_subscription_nag

- name: Ensure the node belongs to the cluster
  ansible.builtin.include_tasks: cluster.yml
  when: proxmox_cluster_configure

- name: Ensure the datacenter options are configured
  ansible.builtin.include_tasks: datacenter.yml
  when:
    - proxmox_datacenter_configure
    - proxmox_cluster_manager | bool

- name: Ensure the notification targets are configured
  ansible.builtin.include_tasks: notifications.yml
  when:
    - proxmox_notification_configure
    - proxmox_cluster_manager | bool

- name: Ensure the local disks are prepared
  ansible.builtin.include_tasks: disk.yml
  when: proxmox_disk_configure
- name: Ensure the CPU scaling governor is set
  ansible.builtin.include_tasks: governor.yml
  when: proxmox_cpu_governor_configure

- name: Ensure the processor microcode is current
  ansible.builtin.include_tasks: microcode.yml
  when: proxmox_microcode_install

- name: Ensure ACME certificate management is configured
  ansible.builtin.include_tasks: acme.yml
  when: proxmox_acme_configure
