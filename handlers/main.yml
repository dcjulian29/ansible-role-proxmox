---
- name: Reboot host
  ansible.builtin.reboot:
    reboot_timeout: 600

- name: Restart cpu-governor
  ansible.builtin.systemd_service:
    name: cpu-governor.service
    state: restarted
    daemon_reload: true

- name: Restart pveproxy
  ansible.builtin.service:
    name: pveproxy
    state: restarted
