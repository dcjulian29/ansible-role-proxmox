---
proxmox_acme_account: default
proxmox_acme_configure: false
proxmox_acme_domains: "{{ ansible_facts['fqdn'] }}"
proxmox_acme_email: ""
proxmox_acme_url: ""
proxmox_cluster_configure: false
# Corosync ring addresses for this node, most important first. Leave empty to
# let Proxmox use the address the node name resolves to, which is correct when
# management and cluster traffic share one interface.
proxmox_cluster_links: []
# True on the node that owns cluster-wide configuration, which is the primary in
# a cluster and the node itself when it stands alone.
proxmox_cluster_manager: >-
  {{ proxmox_cluster_primary | length == 0 or inventory_hostname == proxmox_cluster_primary }}
proxmox_cluster_name: ""
# Inventory name of the node that creates the cluster. Every other node joins.
proxmox_cluster_primary: ""
# Address a joining node uses to reach the primary. Taken from the primary's
# gathered facts, so it is the machine Ansible actually connected to rather
# than whatever DNS happens to return.
proxmox_cluster_primary_address: >-
  {{ hostvars[proxmox_cluster_primary]['ansible_facts']['default_ipv4']['address'] | default('') }}
# With intel_pstate or amd_pstate only "powersave" (dynamic, the default) and
# "performance" (pinned to maximum) exist.
proxmox_cpu_governor: powersave
proxmox_cpu_governor_configure: false
proxmox_datacenter_configure: false
# Keys written to /etc/pve/datacenter.cfg. Give values exactly as the API
# returns them, since they are compared as strings to decide whether to write.
proxmox_datacenter_options: {}
#   keyboard: en-us
#   language: en
#   mac_prefix: BC:24:11
#   max_workers: 4
proxmox_disk_configure: false
# Filesystems built and mounted to back dir storage. The device may be a whole
# disk or an existing partition; no partition table is written either way. Set
# src to a UUID= form if the kernel is likely to reorder the disk names.
proxmox_disk_filesystems: []
#   - device: /dev/sdb
#     fstype: ext4
#     path: /mnt/pve/local-storage
#     opts: defaults,noatime
# Volume groups and thin pools built to back lvmthin storage. The listed devices
# are claimed whole.
proxmox_disk_volume_groups: []
#   - name: pve-storage
#     devices:
#       - /dev/sdb
#     thinpools:
#       - name: data
#         size: 100%FREE
proxmox_microcode_install: true
proxmox_notification_configure: false
proxmox_notification_endpoints: []
#   - name: gotify
#     type: gotify
#     options:
#       server: https://gotify.example.com
#       token: "{{ vault_proxmox_gotify_token }}"
#       comment: clustername
#   - name: smtp
#     type: smtp
#     options:
#       server: smtp.example.com
#       mode: starttls    # tls (465), starttls (587) or insecure (25)
#       port: 587
#       from-address: proxmox@example.com
#       mailto:
#         - admin@example.com
#       username: proxmox@example.com
#       password: ChangeME!!
#       author: Proxmox Notifications
proxmox_notification_matchers: []
#   - name: default-matcher
#     options:
#       mode: all
#       target:
#         - gotify
#         - smtp
# Tokens and passwords are write only, so an update can never push a rotated
# secret. Run with -e proxmox_notification_replace=true to delete the declared
# targets first and have them recreated from the current variables.
proxmox_notification_replace: false
proxmox_qdevice_address: >-
  {{ hostvars[proxmox_qdevice_host]['ansible_facts']['default_ipv4']['address'] | default('') }}
proxmox_qdevice_configure: false
proxmox_qdevice_host: ""
proxmox_remove_subscription_nag: false
# The type may be dir, nfs, cifs, lvm, lvmthin, zfspool or pbs, each carrying
# its own options. The NFS entries below between them cover every content type
# Proxmox recognizes.
proxmox_storage: []
#   - name: nas-guests
#     type: nfs
#     options:
#       server: nas.example.com
#       export: /volume1/guests
#       content: images,rootdir
#       options: vers=4.2
#   - name: nas-backup
#     type: nfs
#     options:
#       server: nas.example.com
#       export: /volume1/backup
#       content: backup
#       prune-backups: keep-daily=7,keep-weekly=4
#   - name: nas-template
#     type: nfs
#     options:
#       server: nas.example.com
#       export: /volume1/template
#       content: iso,vztmpl,snippets,import
# Local disks are named in nodes so the cluster does not offer the storage on a
# member that has no such disk. One entry naming every node that carries the
# disk beats one entry per node, since a guest can then be migrated between them
# without its disk reference being rewritten. Use lvmthin or dir, not both for
# the same disk; proxmox_disk_volume_groups and proxmox_disk_filesystems build
# whichever one this declares.
#   - name: local
#     type: lvmthin
#     options:
#       vgname: pve-storage
#       thinpool: data
#       content: images,iso,template,rootdir
#       nodes: host1,host2
#   - name: local
#     type: dir
#     options:
#       path: /mnt/pve/local-ssd
#       content: images,rootdir,vztmpl
#       is_mountpoint: 1    # refuse to write to / when the disk is unmounted
#       nodes: host1,host2
#   - name: local-lvm
#     state: absent
proxmox_storage_configure: false
